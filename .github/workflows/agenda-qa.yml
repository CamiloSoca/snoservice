name: Agenda QA

on:
  pull_request:
    paths:
      - 'components/AgendaCalendar.tsx'
      - 'components/BarberClient.tsx'
      - 'app/admin/page.tsx'
      - 'lib/agenda-calendar.ts'
      - 'tests/agenda-calendar.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/agenda-qa.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run regression tests
        run: npm test
      - name: Typecheck Next.js app
        run: npx tsc --noEmit
